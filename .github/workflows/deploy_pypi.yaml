name: Deploy PyPI workflow

on:
  push:
    branches:
      - main

jobs:
  version-increment:
    permissions:
      contents: write
      actions: write
    name: Increment repo version, push tag and create release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        id: version-repo-checkout
        uses: actions/checkout@v4

      - name: Extract repo version
        id: version-extract
        run: |
          echo "PACKAGE_VERSION=$python setup.py --version)" >> $GITHUB_ENV

      - name: Bump version and push tag
        id: version-tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ env.PACKAGE_VERSION }}
      
      - name: Create a GitHub release
        id: version-release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version-tag.outputs.new_tag }}
          name: Release ${{ steps.version-tag.outputs.new_tag }}
          body: ${{ steps.version-tag.outputs.changelog }}

  release-build:
    name: Build and verify release distributions
    runs-on: ubuntu-latest
    permissions:
      # allows the provenance attestation to work
      attestations: write
      id-token: write
    steps:
      - name: Check out repository
        id: build-repo-checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          python-version: ["3.10", "3.11"]

      - name: Build and lint dist
        id: build-dist
        uses: hynek/build-and-inspect-python-package@v2
        with:
          attest-build-provenance-github: 'true'
  
  release-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    needs: release-build
    permissions:
      # mandatory for PyPI Trusted Publishing
      id-token: write
    environment:
      name: pypi
    steps:
      - name: Retrieve release distributions
        id: publish-retrieve-dist
        uses: actions/download-artifact@v5
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions on PyPI
        id: publish-to-pypi
        uses: pypa/gh-action-pypi-publish@release/v1
