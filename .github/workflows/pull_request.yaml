name: "Pull Request Workflow"
on:
  pull_request:
    # The specific activity types are listed here to include "labeled" and "unlabeled"
    # (which are not included by default for the "pull_request" trigger).
    # This is needed to allow skipping enforcement of the changelog in PRs with specific labels,
    # as defined in the (optional) "skipLabels" property.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

jobs:
  check-branch:
    # Source: https://stackoverflow.com/questions/71120146/
    name: Enforce only develop and hotfix can merge into main
    runs-on: ubuntu-latest
    steps:
      - name: Check branch
        if: ${{github.base_ref == 'main' && (github.head_ref != 'develop' || startsWith(github.head_ref, 'hotfix'))}}
        run: |
          echo "ERROR: You can only merge to main from develop or hotfix branches."
          exit 1
  
  changelog:
    name: Check for changelog update
    runs-on: ubuntu-latest
    needs: check-branch
    steps:
      - uses: dangoslen/changelog-enforcer@v3
  
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    needs: changelog
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v6
      
      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1

  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    needs: pre-commit
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install system dependencies
        # This prevents failure of raz_client to install due to dependency on krb5-config
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip3 install -e .[dev]

      - name: Run unit tests
        run: pytest
