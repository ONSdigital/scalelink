name: Pull request workflow
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
permissions:
  contents: read

jobs:
  check-branch:
    # Source: https://stackoverflow.com/questions/71120146/
    name: Enforce only develop can merge into main
    runs-on: ubuntu-latest
    steps:
      - name: Check branch
        id: check-branch
        if: ${{ github.base_ref == 'main' && (github.head_ref != 'develop') }}
        run: |
          echo "ERROR: You can only merge to main from develop."
          exit 1

  changelog:
    name: Check for changelog update
    runs-on: ubuntu-latest
    needs: check-branch
    steps:
      - name: Check changelog
        id: changelog
        uses: dangoslen/changelog-enforcer@8b5e9dc3121363bb7c0115f8533404d92af382de

  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    needs: changelog
    steps:
      - name: Check out repository
        id: pre-commit-repo-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        id: pre-commit-python-set-up
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97

      - name: Run pre-commit hooks
        id: pre-commit-run
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd

  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    needs: pre-commit
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Check out repository
        id: test-repo-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python ${{ matrix.python-version }}
        id: test-python-set-up
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        # This prevents failure of raz_client to install due to dependency on krb5-config
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev

      - name: Install dependencies
        id: test-dependency-install
        run: |
          python -m pip install --upgrade pip
          pip3 install .
          pip3 install --group test

      - name: Run unit tests
        id: test-run
        run: pytest
