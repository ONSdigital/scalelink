name: Deploy version to PyPI

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Version to deploy, e.g. 1.0.0"
        required: true
        type: string

jobs:
  release-build:
    name: Build and verify release distributions
    runs-on: ubuntu-latest
    permissions:
      # allows the provenance attestation to work
      attestations: write
      id-token: write

    steps:
      - name: Check out repository
        id: build-repo-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build and lint dist
        id: build-dist
        uses: hynek/build-and-inspect-python-package@67230f7b8410ae0052b39c1efc89d89fff43ff10
        with:
          attest-build-provenance-github: 'true'

  release-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    needs: release-build
    permissions:
      # mandatory for PyPI Trusted Publishing
      id-token: write
    environment:
      name: pypi
    steps:
      - name: Retrieve release distributions
        id: publish-retrieve-dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: Packages
          path: dist/

      - name: Publish release distributions on PyPI
        id: publish-to-pypi
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          skip-existing: true
