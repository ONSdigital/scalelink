[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scalelink"
version = "0.1.1"
dependencies = [
  "boto3 >= 1.34.149",
  "numpy >= 1.24",
  "pandas >= 2.0",
  "pyspark >= 3.0.0, < 4.0.0",
  "raz_client >= 1.1.0",
  "rdsa_utils >= 0.16.0",
]
requires-python = ">= 3.10, < 3.12"
authors = [
  {name = "Data Linkage team, Methodology & Quality Directorate, Office for National Statistics", email = "datalinkage@ons.gov.uk"},
]
description = "A Python and PySpark implementation of the Scalelink method of data linkage by Goldstein et al."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "data linkage",
  "harvey goldstein",
  "linkage",
  "probabilistic data linkage",
  "probabilistic linkage",
  "scalelink"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
build = [
  "build >= 1.4.0",
  "check-wheel-contents >= 0.6.3",
  "hatchling >= 1.28.0",
  "twine >= 6.2.0",
]
dev = [
  "ruff >= 0.0.270",
]
test = [
  "chispa >= 0.9.2",
  "pre-commit >= 2.6.0",
  "pytest >= 7.1.0",
  "pytest-cov >= 4.0.0",
]

[project.urls]
source = "https://github.com/ONSdigital/scalelink"
issues = "https://github.com/ONSdigital/scalelink/issues"
changelog = "https://github.com/ONSdigital/scalelink/blob/develop/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
only-include = ["scalelink"]

[tool.ruff]
extend-include = ["*.ipynb", "*.md"]
# Exclude a variety of commonly ignored directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "doc",
]

[tool.ruff.format]
# Change formatting to be more like black
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint.mccabe]
# Flag when cyclomatic complexity is too high
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.typos.default]
locale = "en-gb"

[tool.typos.default.extend-words]
labeled = "labeled"
sav = "sav"
synchronize = "synchronize"
"tring" = "tring"
unlabeled = "unlabeled"
